  <text x="20" y="50.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">5-player Cricket 19 controller router with live bench swaps via virtual Xbox pads.</text>

  <circle cx="24" cy="65.5" r="4" fill="#DEA584"/>
