<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="presentation">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#30363D"/>
      <stop offset="0.85" stop-color="#30363D"/>
      <stop offset="1" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="12" width="1200" height="1.5" fill="url(#rule)"/>
  <rect x="-160" y="10.5" width="160" height="4.5" rx="2.25" fill="url(#spark)">
    <animate attributeName="x" values="-160; 1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
