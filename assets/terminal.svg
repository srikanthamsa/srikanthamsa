<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="macOS terminal: open-sourcing everything I touch">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171528"/>
      <stop offset="1" stop-color="#0F101C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F3A5E"/>
      <stop offset="0.5" stop-color="#343A52"/>
      <stop offset="1" stop-color="#2B2F45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B6CF0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7B6CF0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="l1"><rect x="402" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 505; 505; 0; 0" keyTimes="0; 0.075; 0.225; 0.235; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l2"><rect x="402" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 661; 661; 0; 0" keyTimes="0; 0.25; 0.325; 0.475; 0.485; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l3"><rect x="402" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 537; 537; 0; 0" keyTimes="0; 0.5; 0.575; 0.725; 0.735; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l4"><rect x="402" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 552; 552; 0; 0" keyTimes="0; 0.75; 0.825; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="102" rx="14" fill="url(#win)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="17" y="3" width="1166" height="38" rx="12" fill="url(#shine)"/>
  <ellipse cx="980" cy="0" rx="360" ry="90" fill="url(#glow)"/>

  <circle cx="36" cy="28" r="6.5" fill="#FF5F57"/>
  <circle cx="58" cy="28" r="6.5" fill="#FEBC2E"/>
  <circle cx="80" cy="28" r="6.5" fill="#28C840"/>

  <text x="600" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.4" fill="#6F7590">srikanthamsa — zsh</text>

  <text x="128" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#8B93A7">~/srikanthamsa $</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#E9EAF2">
    <text x="402" y="64" textLength="499" lengthAdjust="spacingAndGlyphs" clip-path="url(#l1)">
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.225; 0.235; 1" dur="16s" repeatCount="indefinite"/>
      open-sourcing everything I touch
    </text>
    <text x="402" y="64" textLength="655" lengthAdjust="spacingAndGlyphs" clip-path="url(#l2)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.26; 0.475; 0.485; 1" dur="16s" repeatCount="indefinite"/>
      shipping for mac · ios · windows · android
    </text>
    <text x="402" y="64" textLength="531" lengthAdjust="spacingAndGlyphs" clip-path="url(#l3)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.5; 0.51; 0.725; 0.735; 1" dur="16s" repeatCount="indefinite"/>
      porting games to the mac, properly
    </text>
    <text x="402" y="64" textLength="546" lengthAdjust="spacingAndGlyphs" clip-path="url(#l4)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.75; 0.76; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
      mods, tooling, and pixels that move
    </text>
  </g>

  <rect x="402" y="41" width="14" height="27" fill="#F2F3F9">
    <animate attributeName="x" values="402; 907; 907; 402; 1063; 1063; 402; 939; 939; 402; 954; 954; 402; 402" keyTimes="0; 0.075; 0.225; 0.235; 0.325; 0.475; 0.485; 0.575; 0.725; 0.735; 0.825; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 1; 0; 0; 1" keyTimes="0; 0.45; 0.46; 0.95; 1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
