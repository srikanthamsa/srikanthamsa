<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="Terminal: open-sourcing everything I touch">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232A32"/>
      <stop offset="0.5" stop-color="#3A404A"/>
      <stop offset="1" stop-color="#2C2A24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="signal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9C349" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E9C349" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="l1"><rect x="320" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 505; 505; 0; 0" keyTimes="0; 0.075; 0.225; 0.235; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l2"><rect x="320" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 661; 661; 0; 0" keyTimes="0; 0.25; 0.325; 0.475; 0.485; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l3"><rect x="320" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 537; 537; 0; 0" keyTimes="0; 0.5; 0.575; 0.725; 0.735; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l4"><rect x="320" y="40" width="0" height="34">
      <animate attributeName="width" values="0; 0; 552; 552; 0; 0" keyTimes="0; 0.75; 0.825; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="102" rx="14" fill="#0D1117" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="17" y="3" width="1166" height="38" rx="12" fill="url(#shine)"/>
  <ellipse cx="1040" cy="18" rx="300" ry="80" fill="url(#signal)"/>

  <circle cx="36" cy="28" r="6.5" fill="#E9C349"/>
  <circle cx="58" cy="28" r="6.5" fill="#2E333B"/>
  <circle cx="80" cy="28" r="6.5" fill="#2E333B"/>

  <g transform="translate(1014 17) scale(0.78)" fill="#E9C349" opacity="0.85">
    <path d="M3 5.5 C4.6 6.3 6.2 6.2 7.5 5.6 C8 3.9 8.9 2.5 9.9 1.4 L11.2 4.1 C11.7 4 12.3 4 12.8 4.1 L14.1 1.4 C15.1 2.5 16 3.9 16.5 5.6 C17.8 6.2 19.4 6.3 21 5.5 C20.2 8 20.6 10.6 21.6 12.6 C19.6 14.4 17.4 14.6 15.2 12.8 C13.8 14.4 12.9 15 12 15 C11.1 15 10.2 14.4 8.8 12.8 C6.6 14.6 4.4 14.4 2.4 12.6 C3.4 10.6 3.8 8 3 5.5 Z"/>
  </g>
  <text x="1164" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.5" fill="#7D8590">NIGHT SHIFT</text>

  <text x="128" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#7D8590"><tspan fill="#E9C349">gotham</tspan>:~ $</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#E6EDF3">
    <text x="320" y="64" textLength="499" lengthAdjust="spacingAndGlyphs" clip-path="url(#l1)">
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.225; 0.235; 1" dur="16s" repeatCount="indefinite"/>
      open-sourcing everything I touch
    </text>
    <text x="320" y="64" textLength="655" lengthAdjust="spacingAndGlyphs" clip-path="url(#l2)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.26; 0.475; 0.485; 1" dur="16s" repeatCount="indefinite"/>
      shipping for mac · ios · windows · android
    </text>
    <text x="320" y="64" textLength="531" lengthAdjust="spacingAndGlyphs" clip-path="url(#l3)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.5; 0.51; 0.725; 0.735; 1" dur="16s" repeatCount="indefinite"/>
      porting games to the mac, properly
    </text>
    <text x="320" y="64" textLength="546" lengthAdjust="spacingAndGlyphs" clip-path="url(#l4)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.75; 0.76; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
      mods, tooling, and pixels that move
    </text>
  </g>

  <rect x="320" y="41" width="14" height="27" fill="#F0C64D">
    <animate attributeName="x" values="320; 825; 825; 320; 981; 981; 320; 857; 857; 320; 872; 872; 320; 320" keyTimes="0; 0.075; 0.225; 0.235; 0.325; 0.475; 0.485; 0.575; 0.725; 0.735; 0.825; 0.975; 0.985; 1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 1; 0; 0; 1" keyTimes="0; 0.45; 0.46; 0.95; 1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
